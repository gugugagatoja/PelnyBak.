# Tests the desktop app with the real AI model, then builds the offline Windows program
# (portable folder in a .zip, model included) and publishes it as the "program-windows" release.
# Built on Linux: the repository name ends with a dot, which Windows runners cannot check out.
name: Program dla Windows

on:
  push:
    branches: [main, claude/person-search-video-app-477dpd]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  test:
    name: Test z prawdziwym modelem AI i budowa programu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Prepare offline app (web app + AI runtime + model)
        run: bash scripts/prepare-offline.sh
      - name: Make test video (4 s red, 4 s blue, 4 s green)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb zip >/dev/null
          ffmpeg -loglevel error -f lavfi -i color=red:s=640x360:d=4 -f lavfi -i color=blue:s=640x360:d=4 \
            -f lavfi -i color=green:s=640x360:d=4 -filter_complex "[0][1][2]concat=n=3:v=1[v]" -map "[v]" test.webm
      - name: Run the desktop app with the real model
        run: xvfb-run -a node tests/electron-smoke.mjs test.webm --expect-model --screenshot screenshot.png
      - name: Build portable Windows program (.zip)
        run: bash scripts/package-windows.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete program-windows --yes --cleanup-tag || true
          gh release create program-windows desktop/dist/Szukaj-w-filmie-Windows.zip --target "$GITHUB_SHA" \
            --title "Szukaj w filmie – program dla Windows" \
            --notes "Rozpakuj ZIP (np. na pendrive) i uruchom **Szukaj w filmie.exe** w folderze *Szukaj w filmie*. Działa offline, model AI jest w środku, nic nie trzeba instalować. Jeśli Windows pokaże ostrzeżenie: *Więcej informacji* → *Uruchom mimo to*."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore
